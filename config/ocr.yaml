seed: 42

paths:
  source_text: data/processed/ag_news_train.parquet
  generated_dir: data/ocr/generated
  metadata_file: data/ocr/metadata/samples.csv
  results_dir: results/ocr

dataset:
  source: ag_news
  train_samples: 1000
  validation_samples: 200
  test_samples: 200
  text_column: text
  max_text_length: 32

image:
  width: 256
  height: 64
  font_size: 24
  padding: 6
  augment: false

model:
  type: crnn
  cnn_channels: [32, 64, 128]
  hidden_size: 128
  lstm_layers: 2
  dropout: 0.1

training:
  epochs: 3
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  precision: fp32
  num_workers: 0
  pin_memory: true
  checkpoint_every: 1

benchmark:
  warmup_batches: 1
  batch_sizes: [8, 16, 32, 64, 128]
  precisions: [fp32, fp16, bf16]
  resolutions:
    - [128, 32]
    - [256, 64]
    - [512, 128]
